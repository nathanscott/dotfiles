# Starship config — minimal, fast, informative.
# Docs: https://starship.rs/config/

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$ruby\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 1500

[character]
success_symbol = "[➜](bold green)"
error_symbol   = "[✗](bold red)"
vimcmd_symbol  = "[<](bold green)"

[directory]
truncation_length = 4
truncate_to_repo  = true
style             = "bold cyan"
read_only         = " 󰌾"

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
style              = "yellow"
ahead              = "⇡${count}"
diverged           = "⇕⇡${ahead_count}⇣${behind_count}"
behind             = "⇣${count}"
modified           = "!${count}"
staged             = "+${count}"
untracked          = "?${count}"
stashed            = "≡"
deleted            = "✘${count}"
renamed            = "»${count}"
conflicted         = "=${count}"

[cmd_duration]
min_time = 2000
format   = "[took $duration]($style) "
style    = "yellow"

[nodejs]
format = "via [󰎙 $version]($style) "
style  = "bold green"

[python]
format = 'via [🐍 $version]($style) '

[ruby]
format = 'via [💎 $version]($style) '

[rust]
format = 'via [🦀 $version]($style) '

[golang]
format = 'via [🐹 $version]($style) '

[hostname]
ssh_only = true
format   = "on [$hostname](bold red) "

[username]
show_always = false
style_user  = "bold yellow"

[time]
disabled = true
